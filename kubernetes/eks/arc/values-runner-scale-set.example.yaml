# Example values for the `gha-runner-scale-set` Helm chart — one release per
# repo (or org) that needs self-hosted runners. Copy this file per team,
# rename the release, and fill in githubConfigUrl.
#
# Ephemeral by design: gha-runner-scale-set launches exactly one runner pod
# per job and tears it down afterwards — no persistent runner pool to patch,
# no lateral-movement surface left standing between jobs. See
# docs/interview-talking-points.md.

githubConfigUrl: "https://github.com/<org>/<repo>"
githubConfigSecret: arc-github-app # created per terraform/modules/arc/README.md

minRunners: 0
maxRunners: 10

# The cluster's require-container-limits Gatekeeper constraint
# (policy/gatekeeper-constraints/) applies to every real Pod, no
# exemption for controller-managed ones — the listener pod this chart
# creates for the scale set is no exception. A real `helm install`
# without this was rejected outright by the admission webhook:
# "[require-container-limits] Container <listener> has no CPU/memory
# limit set". The container must be named exactly `listener` for the
# chart to apply this instead of treating it as an unrelated sidecar.
listenerTemplate:
  spec:
    containers:
      - name: listener
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 100m
            memory: 128Mi

template:
  spec:
    # Pins runner pods to the Karpenter CI-only NodePool (Spot-first,
    # tainted so app workloads never land here) — see
    # kubernetes/eks/karpenter/nodepool-ci-runners.yaml.
    nodeSelector:
      workload: ci-runner
    tolerations:
      - key: workload
        operator: Equal
        value: ci-runner
        effect: NoSchedule

    # Only set this if terraform/modules/arc's runner_irsa_policy_json was
    # configured for this team, and must match runner_service_account_name.
    # serviceAccountName: arc-runner

    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        # Same require-container-limits constraint applies to the actual
        # ephemeral runner pod spawned per job, not just the listener —
        # size these for the jobs this scale set actually runs.
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 4Gi
