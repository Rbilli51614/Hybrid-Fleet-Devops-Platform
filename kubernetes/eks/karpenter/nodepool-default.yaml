# Default NodePool for general application workloads. Diversified instance
# types and a spot+on-demand mix (see docs/pitfalls.md: a narrow instance
# pool is what turns a Spot interruption spike into a CI/app queue backup).
#
# The CI-runner-specific NodePool (Spot-first, tainted so it never contends
# with app workloads for capacity — see docs/pitfalls.md) is added in
# Phase 2 alongside the ARC runner controller.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["4"]
      expireAfter: 720h
  limits:
    cpu: 1000
    memory: 1000Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
