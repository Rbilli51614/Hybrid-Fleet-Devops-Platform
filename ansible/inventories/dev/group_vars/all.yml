---
# Wires the dev VM-tier bootstrap to terraform/live/dev/vm-k8s's actual
# state. Regenerate this file's overridable values after every apply:
#
#   cd terraform/live/dev/vm-k8s
#   echo "join_token_ssm_path: \"$(terragrunt output -raw join_token_ssm_path)\"" \
#     > ../../../../ansible/inventories/dev/group_vars/vm_k8s_outputs.yml
#
# (kept as a separate generated file rather than edited in place here, so
# this file's defaults stay meaningful for anyone reading the repo cold —
# but note "vm_k8s_outputs" isn't a real inventory group, so that file is
# NOT auto-loaded the way this one is; pass it explicitly with
# `-e @inventories/dev/group_vars/vm_k8s_outputs.yml`, see ansible/README.md)

aws_region: "us-east-1"
cluster_name: "hybrid-fleet-vm-k8s"

# The SSM file-transfer staging bucket the aws_ssm connection plugin needs
# (see terraform/modules/vm-k8s-asg's ssm_transfer_bucket_name output,
# exported as ANSIBLE_SSM_BUCKET — ansible/README.md). This has to live
# here, not in inventories/dev/aws_ec2.yml's own `compose` block: that
# plugin's compose evaluation context doesn't reliably run the `env`
# lookup (it silently resolves to nothing — confirmed against a real
# dynamic-inventory run, not assumed), while group_vars templating, which
# runs through the normal Jinja pipeline, does.
ansible_aws_ssm_bucket_name: "{{ lookup('ansible.builtin.env', 'ANSIBLE_SSM_BUCKET') }}"

# Matches terraform/modules/vm-k8s-asg's default (join_token_ssm_path unset
# there resolves to "/<cluster_name>/join-command"). If that variable is
# ever overridden in terraform/live/dev/vm-k8s, override it here too — or
# better, regenerate via vm_k8s_outputs.yml (see above) so this can't drift.
join_token_ssm_path: "/hybrid-fleet-vm-k8s/join-command"
