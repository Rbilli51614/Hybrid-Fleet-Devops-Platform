[defaults]
inventory = inventories/dev/aws_ec2.yml
roles_path = roles
host_key_checking = False
interpreter_python = auto_silent
retry_files_enabled = False

[inventory]
enable_plugins = amazon.aws.aws_ec2

[ssh_connection]
# Unused for the VM tier (see connection plugin note in inventories/dev/aws_ec2.yml)
# but kept sane for any future host group that does use SSH.
pipelining = True
