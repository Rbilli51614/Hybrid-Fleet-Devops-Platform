# Originally terraform-plan.yml. Every push to main (an event this workflow
# doesn't even trigger on) produced a phantom `failure` run with zero jobs,
# survived across editing the file in place, deleting and recreating it at
# the same path, and even renaming it to a brand-new workflow ID — none of
# which should have mattered if the cause were registration staleness, which
# is what the symptoms looked like at first. It wasn't. GitHub's actual error
# (only visible in its own UI, not through the API or `gh run view`, which
# both just say "workflow file issue"):
#
#   Invalid workflow file: .github/workflows/terraform-plan-check.yml#L1
#   Unrecognized named-value: 'secrets'. Located at position 28 within
#   expression: vars.AWS_ROLE_ARN != '' || secrets.AWS_ROLE_ARN != ''
#
# `secrets` was never a valid context inside a *job-level* `if:` —
# `jobs.<job_id>.if` only has access to `github`, `needs`, `vars`, and
# `inputs`, never `secrets`. GitHub validates the whole file up front, so one
# invalid expression anywhere invalidates the entire workflow and produces a
# zero-job failure for every event GitHub evaluates it against — including
# events it doesn't even declare a trigger for, which is what made this look
# like a registration problem rather than a syntax one. Fixed below by moving
# the presence check into a step (where `secrets` is valid) and having the
# `plan` job read that step's output through `needs` instead.
name: Terraform Plan

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-plan-check.yml"

permissions:
  contents: read
  # Enables OIDC federation to AWS instead of long-lived access keys.
  # Configure the AWS_ROLE_ARN repo/environment secret before this can plan.
  id-token: write
  pull-requests: write

jobs:
  fmt-and-validate:
    name: fmt & validate (no AWS credentials required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: terraform fmt -check
        run: terraform fmt -recursive -check -diff terraform/

      - name: terraform validate (per module)
        run: |
          set -euo pipefail
          for dir in terraform/modules/*/; do
            echo "== validating $dir =="
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  check-aws-role:
    name: Check whether AWS_ROLE_ARN is configured
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check for a repo/environment variable or secret named AWS_ROLE_ARN
        id: check
        # `secrets` is valid here (a step, not a job-level `if:`) — and this
        # only ever checks whether the value is non-empty, never echoes it,
        # so the ARN (not sensitive on its own, but treated consistently
        # either way) never appears in the log.
        run: |
          if [ -n "${{ vars.AWS_ROLE_ARN }}${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  plan:
    name: terragrunt plan (dev)
    runs-on: ubuntu-latest
    needs: [fmt-and-validate, check-aws-role]
    # Only runs once AWS_ROLE_ARN is configured as a repo/environment secret.
    if: needs.check-aws-role.outputs.configured == 'true'
    strategy:
      matrix:
        # Order matters for a first run against an empty account: each stack
        # depends on the previous one's outputs via a Terragrunt `dependency`
        # block. GitHub Actions runs matrix jobs in parallel by default, so
        # this only actually plans cleanly stack-by-stack once earlier ones
        # have real state — see terraform/live/dev/*/terragrunt.hcl.
        stack:
          - terraform/live/dev/cloud-vpc
          - terraform/live/dev/onprem-vpc
          - terraform/live/dev/eks
          - terraform/live/dev/karpenter
          - terraform/live/dev/arc
          - terraform/live/dev/alb-ingress-controller
          - terraform/live/dev/opa-gatekeeper
          - terraform/live/dev/dns
          - terraform/live/dev/vpn
          - terraform/live/dev/nexus
          - terraform/live/dev/observability
          - terraform/live/dev/otel-collector
          - terraform/live/dev/vm-k8s
          # No dependency block, so plans cleanly regardless of matrix
          # ordering — but a real apply must wait until the tags above have
          # existed on a resource for ~24h, see
          # terraform/modules/cost-allocation-tags/README.md.
          - terraform/live/global/cost-allocation-tags
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Install Terragrunt
        run: |
          curl -sL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v1.1.4/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: terragrunt plan
        working-directory: ${{ matrix.stack }}
        run: terragrunt plan -out=tfplan
