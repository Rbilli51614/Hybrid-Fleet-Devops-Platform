# GitHub's own registration of this workflow went stale at some point after
# it was first created — `gh api .../actions/workflows` kept reporting its
# name as the literal file path instead of "Terraform Plan" below, and every
# push to main (an event this workflow doesn't even trigger on) produced a
# phantom `failure` run with zero jobs ("This run likely failed because of a
# workflow file issue"). The file's actual content was never wrong; GitHub
# just never re-parsed it. Confirmed by comparing against arc-smoke-test.yml,
# registered correctly from day one with no such phantom runs. Any edit that
# gets pushed forces GitHub to re-index it — this comment is that edit.
name: Terraform Plan

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  # Enables OIDC federation to AWS instead of long-lived access keys.
  # Configure the AWS_ROLE_ARN repo/environment secret before this can plan.
  id-token: write
  pull-requests: write

jobs:
  fmt-and-validate:
    name: fmt & validate (no AWS credentials required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: terraform fmt -check
        run: terraform fmt -recursive -check -diff terraform/

      - name: terraform validate (per module)
        run: |
          set -euo pipefail
          for dir in terraform/modules/*/; do
            echo "== validating $dir =="
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  plan:
    name: terragrunt plan (dev)
    runs-on: ubuntu-latest
    needs: fmt-and-validate
    # Only runs once AWS_ROLE_ARN is configured as a repo/environment secret.
    if: ${{ vars.AWS_ROLE_ARN != '' || secrets.AWS_ROLE_ARN != '' }}
    strategy:
      matrix:
        # Order matters for a first run against an empty account: each stack
        # depends on the previous one's outputs via a Terragrunt `dependency`
        # block. GitHub Actions runs matrix jobs in parallel by default, so
        # this only actually plans cleanly stack-by-stack once earlier ones
        # have real state — see terraform/live/dev/*/terragrunt.hcl.
        stack:
          - terraform/live/dev/cloud-vpc
          - terraform/live/dev/onprem-vpc
          - terraform/live/dev/eks
          - terraform/live/dev/karpenter
          - terraform/live/dev/arc
          - terraform/live/dev/alb-ingress-controller
          - terraform/live/dev/opa-gatekeeper
          - terraform/live/dev/dns
          - terraform/live/dev/vpn
          - terraform/live/dev/nexus
          - terraform/live/dev/observability
          - terraform/live/dev/otel-collector
          - terraform/live/dev/vm-k8s
          # No dependency block, so plans cleanly regardless of matrix
          # ordering — but a real apply must wait until the tags above have
          # existed on a resource for ~24h, see
          # terraform/modules/cost-allocation-tags/README.md.
          - terraform/live/global/cost-allocation-tags
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Install Terragrunt
        run: |
          curl -sL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v1.1.4/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: terragrunt plan
        working-directory: ${{ matrix.stack }}
        run: terragrunt plan -out=tfplan
